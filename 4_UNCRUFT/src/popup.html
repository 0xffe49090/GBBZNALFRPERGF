<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uncruft</title><link rel="stylesheet" href="common.css">
<style>
body{width:430px}main{padding:16px}.card{margin-bottom:12px}button{flex:1}.output{max-height:120px;overflow:auto}
.activity{list-style:none;padding:0;margin:8px 0 0}.activity li{border-top:1px solid var(--border);padding:8px 0;font-size:12px}.activity time{display:block;color:var(--muted);margin-top:2px}.details{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}
</style></head><body><main>
<h1 style="font-size:22px">Uncruft</h1><p id="summary">Checking this link...</p>
<section class="card"><div id="url" class="output"></div><p id="removed" class="small"></p></section>
<div class="row"><button id="navigate" class="primary">Open clean link</button><button id="copy">Copy clean link</button></div>
<div class="row" style="margin-top:10px"><button id="copyOriginal">Copy original</button><button id="options">Settings</button></div>
<section class="card" style="margin-top:12px"><div class="row space"><h2 style="margin:0">Recent activity</h2><button id="clearActivity" style="flex:0">Clear</button></div><ul id="activity" class="activity"><li>No activity recorded yet.</li></ul></section>
<div class="row"><button id="runTests">Run self-test</button></div>
<p id="status" class="status"></p>
<script src="api.js"></script><script src="rules.js"></script><script src="popup.js"></script>
</main></body></html>
